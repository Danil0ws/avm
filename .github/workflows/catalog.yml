name: Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'avm-catalog/scripts/**'
      - 'avm-catalog/sources/**'
      - '.github/workflows/catalog.yml'

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    name: Collect & validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: avm-catalog

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: avm-catalog/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Java catalog
        run: python scripts/generate_catalog.py --tool java --output-dir public --previous-dir public
        continue-on-error: true
        id: java

      - name: Collect Node.js catalog
        run: python scripts/generate_catalog.py --tool node --output-dir public --previous-dir public
        continue-on-error: true
        id: node

      - name: Validate Java
        if: steps.java.outcome == 'success'
        run: python scripts/validate.py public/tools/java.json public/schema/catalog.schema.json

      - name: Validate Node.js
        if: steps.node.outcome == 'success'
        run: python scripts/validate.py public/tools/node.json public/schema/catalog.schema.json

      - name: Summary
        run: |
          echo "## Catalog Update" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.java.outcome }}" = "success" ]; then
            echo "| Java | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Java | ❌ (previous data kept) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.node.outcome }}" = "success" ]; then
            echo "| Node.js | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Node.js | ❌ (previous data kept) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || git commit -m "chore: refresh catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: avm-catalog/public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
