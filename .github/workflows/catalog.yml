name: Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'avm-catalog/scripts/**'
      - 'avm-catalog/sources/**'
      - '.github/workflows/catalog.yml'

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    name: Collect ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tool: [java, node, go, python, dotnet, ruby, rust, flutter]
      fail-fast: false
    defaults:
      run:
        working-directory: avm-catalog

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: avm-catalog/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect ${{ matrix.tool }}
        run: python scripts/generate_catalog.py --tool ${{ matrix.tool }} --output-dir public --previous-dir public
        id: collect

      - name: Validate
        if: steps.collect.outcome == 'success'
        run: python scripts/validate.py public/tools/${{ matrix.tool }}.json public/schema/catalog.schema.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-${{ matrix.tool }}
          path: avm-catalog/public/tools/${{ matrix.tool }}.json
          if-no-files-found: warn

  commit:
    name: Commit & Deploy
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avm-catalog

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-*
          path: avm-catalog/public/tools/
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate index & catalog.json
        run: |
          python - <<'EOF'
          import json, glob, os
          from datetime import datetime, timezone

          SCHEMA_VERSION = 1
          tools_dir = "public/tools"
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          tool_files = sorted(glob.glob(f"{tools_dir}/*.json"))
          tools = []
          combined = {}
          for f in tool_files:
              name = os.path.basename(f).replace(".json", "")
              tools.append({"name": name, "path": f"tools/{name}.json"})
              with open(f) as fh:
                  combined[name] = json.load(fh)

          index = {"generated_at": now, "schema_version": SCHEMA_VERSION, "tools": tools}
          with open("public/index.json", "w") as fh:
              json.dump(index, fh, indent=2, sort_keys=True)

          catalog = {"generated_at": now, "schema_version": SCHEMA_VERSION, "tools": combined}
          with open("public/catalog.json", "w") as fh:
              json.dump(catalog, fh, indent=2, sort_keys=True)

          print(f"Index: {len(tools)} tools")
          EOF

      - name: Summary
        run: |
          echo "## Catalog Update" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          for tool in java node go python dotnet ruby rust flutter; do
            if [ -f "public/tools/${tool}.json" ]; then
              echo "| ${tool} | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${tool} | ❌ (not collected) |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || git commit -m "chore: refresh catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: avm-catalog/public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
